<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>

  <!-- Subtle glow ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Stylized Persian "ت" and Task Checkmark emblem -->
  <g filter="url(#dropShadow)" transform="translate(106, 96)">
    <!-- Main curved bowl of "ت" -->
    <path d="M 40 180 C 40 250 80 280 150 280 C 220 280 260 250 260 180" 
          fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left upward stroke of "ت" -->
    <path d="M 40 180 L 40 130" 
          fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
    
    <!-- Right upward flourish stroke of "ت" -->
    <path d="M 260 180 L 260 110" 
          fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>

    <!-- Two dots of "ت" styled as dynamic diamond check gems -->
    <rect x="100" y="40" width="34" height="34" rx="8" transform="rotate(45 117 57)" fill="#34D399"/>
    <rect x="170" y="40" width="34" height="34" rx="8" transform="rotate(45 187 57)" fill="#38BDF8"/>
  </g>
</svg>
